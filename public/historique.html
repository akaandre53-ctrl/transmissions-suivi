<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
  <title>Historique des transmissions</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/">
      <span class="brand__mark"><span data-icon="leaf"></span></span>
      <span class="brand__name">Transmission</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a class="nav__link" href="/" data-nav="saisie" data-roles="aidant admin" hidden><span data-icon="notebook"></span>Saisie</a>
      <a class="nav__link" href="/historique.html" data-nav="historique"><span data-icon="clock"></span>Historique</a>
      <a class="nav__link" href="/admin.html" data-nav="admin" data-roles="admin" aria-label="Administration" hidden><span data-icon="shield"></span>Admin<span class="nav__more">istration</span></a>
    </nav>
    <div class="account">
      <span class="avatar" data-user-initials aria-hidden="true"></span>
      <span class="account__text">
        <span class="account__name" data-user-name></span>
        <span class="account__role" data-user-role></span>
      </span>
      <button type="button" class="icon-btn" data-logout aria-label="Se déconnecter"><span data-icon="logout"></span></button>
    </div>
  </div>
</header>

<section class="hero hero--compact">
  <div class="hero__art" data-landscape></div>
  <div class="hero__inner shell">
    <p class="eyebrow"><span data-icon="clock"></span>Historique</p>
    <h1 class="hero__title" id="hero-title">Les journées, <em>au fil du temps</em></h1>
    <p class="hero__meta" id="hero-meta"></p>
  </div>
</section>

<main id="contenu" class="shell main lift">
  <div class="alert alert--error" id="error" role="alert" tabindex="-1" hidden></div>

  <div class="filters" id="filters" role="group" aria-label="Filtrer par personne accompagnée" hidden></div>

  <div id="loading" class="card loading">
    <span class="spinner" aria-hidden="true"></span>
    <p>Chargement…</p>
  </div>

  <div id="timeline"></div>

  <div id="empty" class="card empty" hidden>
    <span class="empty__icon"><span data-icon="calendar"></span></span>
    <h2 id="empty-title">Aucune transmission pour le moment</h2>
    <p id="empty-text">Les journées enregistrées apparaîtront ici.</p>
  </div>

  <div style="display:flex;justify-content:center;margin-top:24px">
    <button type="button" class="btn btn--ghost" id="more" hidden>Voir les journées précédentes</button>
  </div>
</main>

<footer class="credit">
  <a class="credit__link" href="https://www.primeadvisors-sb.com/" target="_blank" rel="noopener">
    by <strong>Prime Advisors SB, Inc.</strong><span class="visually-hidden"> (ouvre le site dans un nouvel onglet)</span>
  </a>
</footer>

<script type="module" src="/js/historique.js"></script>
</body>
</html>
