<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Pas de maximum-scale ni user-scalable=no : bloquer le zoom rend
       l'application inutilisable pour une personne malvoyante. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F6B57">
  <meta name="description" content="Saisie de la transmission quotidienne de suivi à domicile.">
  <title>Transmission du jour</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <p class="topbar__title">Transmission du jour<span id="user-name">…</span></p>
    <a class="btn btn--quiet" href="/historique.html">Historique</a>
    <button type="button" class="btn btn--quiet" id="logout">Quitter</button>
  </div>
</header>

<main class="shell">
  <div id="loading" class="empty">
    <span class="spinner" aria-hidden="true"></span>
    <p>Chargement du formulaire…</p>
  </div>

  <div id="app" hidden>
    <div class="progress" id="progress">
      <div class="progress__meta">
        <span class="progress__step" id="progress-step">Étape 1 sur 7</span>
        <span id="progress-title">Général et santé</span>
      </div>
      <div class="progress__track" role="progressbar" aria-label="Progression du formulaire"
           aria-valuemin="1" aria-valuemax="7" aria-valuenow="1">
        <div class="progress__bar" id="progress-bar" style="width:14%"></div>
      </div>
    </div>

    <!-- Récapitulatif d'erreurs : focusable, annoncé, et chaque ligne renvoie
         au champ concerné. -->
    <div class="alert alert--error" id="error-summary" role="alert" tabindex="-1" hidden></div>

    <form id="steps" novalidate></form>

    <div id="done" tabindex="-1" hidden></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="actions" id="actions">
      <button type="button" class="btn btn--quiet" id="back" hidden>Retour</button>
      <button type="button" class="btn btn--primary" id="next">Continuer</button>
      <button type="button" class="btn btn--primary" id="submit" hidden>Enregistrer la transmission</button>
    </div>
  </div>
</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
